<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrameScript · 영상 대사 추출기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3ef;color:#202a26;font:16px/1.55 Inter,"Malgun Gothic",sans-serif}header{background:#17251e;color:white;padding:16px max(5vw,20px);font-size:22px;font-weight:750}header b{color:#acdf92}main{max-width:1180px;margin:35px auto;padding:0 20px}h1{font-size:clamp(30px,4vw,48px);letter-spacing:-.06em;margin:0}p{color:#56665b;margin:5px 0 25px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}section{background:white;padding:22px;border:1px solid #cdd5cd;border-radius:12px;margin-bottom:16px}h2{font-size:19px;margin:0 0 15px}.stage{background:#1e2b24;background-image:radial-gradient(#405047 1px,transparent 1px);background-size:16px 16px;min-height:280px;display:grid;place-items:center;border-radius:7px;padding:8px;color:#e3ede5;text-align:center}.stage strong{display:block;font-size:20px;margin-bottom:6px}#frame{position:relative;width:100%;cursor:crosshair;touch-action:none;line-height:0}video{width:100%;pointer-events:none}#box{position:absolute;border:2px solid #aaff87;background:#adff8126;pointer-events:none}label{display:block;font-weight:650;font-size:14px;margin:12px 0 5px}button,input,select,textarea{font:inherit}input,select,textarea{width:100%;padding:8px;border:1px solid #bcc8bf;border-radius:6px}input[type=range]{padding:0;accent-color:#44754c}button,.pick{display:inline-block;border:1px solid #bcc8bf;background:white;border-radius:6px;padding:8px 14px;cursor:pointer;color:#21372b;font-size:15px;font-weight:650}.run,.pick{background:#274e37;color:white}.run{width:100%;margin-top:18px}button:disabled{opacity:.5;cursor:default}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row>*{min-width:0}.row h2{margin:0}.controls{margin-bottom:15px}small,output{color:#5c6b60;font-size:14px}textarea{min-height:150px;resize:vertical}progress{width:100%;accent-color:#437849}[hidden]{display:none!important}@media(max-width:760px){.grid{display:block}.stage{min-height:180px}main{margin:20px auto}}
body{background:#fafafa;color:#121212;font-family:"Arial","Malgun Gothic",sans-serif}header{background:white;color:black;border-bottom:3px solid;font-family:Georgia,serif;font-weight:900;font-style:italic}header b{color:black}main{margin-top:28px}h1{font-weight:900;letter-spacing:-.075em}p,small,output{color:#505050}section{border:2px solid #141414;border-radius:0;box-shadow:4px 4px #161616}button,.pick,input,select,textarea,.stage{border-radius:0;color:#111;border-color:#222}button:hover:not(:disabled){box-shadow:2px 2px black}.run,.pick,#pick{background:#151515;color:white}.stage{color:#111;background-color:#efefef;background-image:radial-gradient(#adadad 1px,transparent 1px);background-size:6px 6px;border:2px solid black}#empty{background:white;border:2px solid black;padding:20px;box-shadow:4px 4px black}#box,#nameBox{position:absolute;pointer-events:none;border:3px solid white;box-shadow:0 0 0 2px black,inset 0 0 0 1px black;background:transparent}#nameBox{border-style:dashed}#box:before,#nameBox:before{position:absolute;left:0;top:0;background:black;color:white;font:700 12px/18px sans-serif;padding:0 3px;content:"대사"}#nameBox:before{content:"이름"}input,progress,input[type=range]{accent-color:#111}.actions{display:flex;gap:8px;flex-wrap:wrap}.toggle input{width:auto}.actions button[aria-pressed=true]{color:white;background:black}#regionTools{margin-top:10px}#formatLabel{margin:0}#format{width:auto;max-width:100%}textarea{margin-top:10px}#copyStatus{min-height:1em;display:block}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px double black;outline-offset:2px}
</style><header><b>▣</b> FrameScript</header><main><h1>영상 대사 추출기</h1><p>영상에서 대사창을 지정하고, 원하는 구간의 텍스트를 추출하세요.</p><div class="grid"><section><div class="row controls"><h2>영상 미리보기</h2><button id="pick">영상 선택</button><input hidden id="file" type="file" accept="video/*"></div><div class="stage" id="stage"><div id="empty"><strong>영상을 여기에 놓으세요</strong>또는 ‘영상 선택’으로 열기</div><div id="frame" hidden><video id="v" muted playsinline></video><div id="box" hidden></div><div id="nameBox" hidden></div></div></div><div class="actions" id="regionTools" hidden><button id="dialogueMode" aria-pressed="true">대사 영역 지정</button><button id="nameMode" aria-pressed="false">이름 영역 지정</button></div><label for="seek">미리보기 위치 <output id="clock"></output></label><input id="seek" type="range" min="0" max="0" step=".01" value="0" disabled><small id="hint">영상을 연 뒤 대사창의 두 모서리 사이를 드래그하세요.</small></section>
<section><h2>추출 설정</h2><label class="toggle"><input type="checkbox" id="names"> 이름 추출하기</label><label for="lang">대사 언어</label><select id="lang"><option value="jpn">일본어</option><option value="kor">한국어</option><option value="eng">영어</option></select><div class="row"><div><label for="start">시작 (초)</label><input id="start" type="number" min="0" step="any" value="0"></div><div><label for="end">종료 (초)</label><input id="end" type="number" min="0" step="any" value="0"></div></div><label for="interval">프레임 검사 간격</label><select id="interval"><option value=".1">0.1초 · 빠른 대사</option><option value=".5" selected>0.5초 · 기본</option><option value="1">1초</option><option value="2">2초</option></select><button id="run" class="run" disabled>텍스트 추출</button><progress id="progress" hidden></progress><small id="status" role="status"></small></section></div>
<section><div class="row controls"><h2>추출된 대사</h2><div class="actions"><button id="copy" disabled>전체 복사</button><button id="save" disabled>TXT 저장</button></div></div><label id="formatLabel" for="format">표시 형식</label><select id="format"><option value="colon">이름: 대사</option><option value="newline">이름 다음 줄에 대사</option></select><textarea id="out" aria-label="추출된 대사 편집" placeholder="추출한 대사가 시간순으로 표시됩니다. 여기서 직접 수정할 수 있어요."></textarea><small id="copyStatus" role="status"></small></section></main><script src="app.js"></script></html>
